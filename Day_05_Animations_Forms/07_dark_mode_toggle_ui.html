<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5: Dark Mode Toggle UI</title>
    <style>
        :root {
            --bg-light: #f0f0f0;
            --text-light: #333;
            --bg-dark: #121212;
            --text-dark: #e0e0e0;
            --accent: #bb86fc;
            
            --transition-speed: 0.5s;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            transition: background-color var(--transition-speed), color var(--transition-speed);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* The trick: use a checkbox and the :checked sibling selector */
        #theme-toggle {
            display: none;
        }

        /* Light Mode (Default) */
        body {
            background-color: var(--bg-light);
            color: var(--text-light);
        }

        /* Dark Mode */
        #theme-toggle:checked ~ body {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        /* Since body is the parent of everything else, we can't use ~ body. 
           Let's wrap content. */
        .page-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: inherit;
        }

        #theme-toggle:checked + .page-wrapper {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        .toggle-label {
            width: 60px;
            height: 30px;
            background-color: #333;
            border-radius: 15px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
            display: block;
            margin-bottom: 20px;
        }

        .toggle-ball {
            width: 24px;
            height: 24px;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: 0.3s;
        }

        #theme-toggle:checked + .page-wrapper .toggle-label {
            background-color: var(--accent);
        }

        #theme-toggle:checked + .page-wrapper .toggle-ball {
            transform: translateX(30px);
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            text-align: center;
            transition: 0.3s;
        }

        #theme-toggle:checked + .page-wrapper .card {
            background: #1e1e1e;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        h1 { margin-top: 0; }
        p { color: #666; transition: 0.3s; }
        #theme-toggle:checked + .page-wrapper p { color: #aaa; }
    </style>
</head>
<body>
    <input type="checkbox" id="theme-toggle">
    <div class="page-wrapper">
        <label for="theme-toggle" class="toggle-label">
            <div class="toggle-ball"></div>
        </label>
        
        <div class="card">
            <h1>System Theme</h1>
            <p>Toggle the switch above to transition between Light and Dark interface modes. This demonstrates smooth CSS transitions on multiple properties simultaneously.</p>
        </div>
    </div>
</body>
</html>
