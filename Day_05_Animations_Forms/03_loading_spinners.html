<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5: Loading Spinners</title>
    <style>
        :root {
            --bg: #080808;
            --primary: #00ff88;
            --secondary: #60efff;
            --tertiary: #ff00ff;
        }

        body {
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            gap: 60px;
            font-family: 'Courier New', Courier, monospace;
        }

        .spinner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        span {
            color: white;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Spinner 1: Circular Border */
        .spinner-1 {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Spinner 2: Double Ring */
        .spinner-2 {
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top-color: var(--secondary);
            border-bottom-color: var(--secondary);
            border-radius: 50%;
            position: relative;
            animation: spin 1.5s linear infinite;
        }

        .spinner-2::after {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 3px solid transparent;
            border-left-color: var(--tertiary);
            border-right-color: var(--tertiary);
            border-radius: 50%;
            animation: spin-reverse 1s linear infinite;
        }

        /* Spinner 3: Bouncing Dots */
        .spinner-3 {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: var(--primary);
            border-radius: 50%;
            animation: bounce 0.6s infinite alternate;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; background-color: var(--secondary); }
        .dot:nth-child(3) { animation-delay: 0.4s; background-color: var(--tertiary); }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            to { transform: rotate(-360deg); }
        }

        @keyframes bounce {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-20px); opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="spinner-container">
        <div class="spinner-1"></div>
        <span>System Loading...</span>
    </div>

    <div class="spinner-container">
        <div class="spinner-2"></div>
        <span>Syncing Data...</span>
    </div>

    <div class="spinner-container">
        <div class="spinner-3">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <span>Processing...</span>
    </div>
</body>
</html>
