<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5: Animated Progress Bar</title>
    <style>
        :root {
            --bg: #1a1a1a;
            --bar-bg: #333;
            --fill: #00ffcc;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .skill-container {
            width: 80%;
            max-width: 600px;
            margin-bottom: 40px;
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: var(--bar-bg);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #00ffcc);
            border-radius: 10px;
            width: 0;
            animation: fillProgress 3s forwards cubic-bezier(0.65, 0, 0.35, 1);
            position: relative;
        }

        /* Animated shine effect */
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shine 2s infinite;
        }

        @keyframes fillProgress {
            0% { width: 0; }
            100% { width: 90%; }
        }

        @keyframes fillProgress75 {
            0% { width: 0; }
            100% { width: 75%; }
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .html-fill { animation-name: fillProgress; }
        .css-fill { animation-name: fillProgress75; }

        .btn-restart {
            padding: 10px 20px;
            background: transparent;
            border: 1px solid var(--fill);
            color: var(--fill);
            cursor: pointer;
            margin-top: 20px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn-restart:hover {
            background: var(--fill);
            color: black;
        }
    </style>
</head>
<body>
    <div class="skill-container">
        <div class="skill-header">
            <span>Neural Interface Sync</span>
            <span>90%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill html-fill"></div>
        </div>
    </div>

    <div class="skill-container">
        <div class="skill-header">
            <span>Core Logic Compilation</span>
            <span>75%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill css-fill" style="animation-delay: 0.5s;"></div>
        </div>
    </div>

    <button class="btn-restart" onclick="location.reload()">Re-initialize Upload</button>
</body>
</html>
