<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Centering</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: sans-serif; }
        
        .hero {
            height: 100vh;
            display: flex;
            justify-content: center; /* Horizontal centering */
            align-items: center;     /* Vertical centering */
            background: radial-gradient(circle, #1a1a1a, #000);
            text-align: center;
        }
        
        .content {
            border: 2px solid #bc13fe;
            padding: 3rem;
            background: rgba(188, 19, 254, 0.05);
            box-shadow: 0 0 30px rgba(188, 19, 254, 0.2);
        }
        
        h1 { font-size: 3.5rem; color: #bc13fe; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <section class="hero">
        <div class="content">
            <h1>09. PERFECT CENTERING</h1>
            <p>Mastering vertical and horizontal alignment in one container.</p>
        </div>
    </section>
</body>
</html>
