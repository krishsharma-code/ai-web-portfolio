<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Grid Flex</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 3rem; }
        h1 { color: #39ff14; text-align: center; margin-bottom: 3rem; }
        
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
        }
        
        .card {
            background: #111;
            border: 1px solid #333;
            padding: 2rem;
            flex: 0 1 300px; /* grow | shrink | basis */
            transition: 0.3s;
            border-bottom: 4px solid #39ff14;
        }
        
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(57, 255, 20, 0.1);
            border-color: #fff;
        }
        
        .card h3 { color: #39ff14; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <h1>10. CARD GRID LAYOUT</h1>
    <div class="grid">
        <div class="card">
            <h3>Neural Engine</h3>
            <p>Advanced AI processing for real-time data analysis.</p>
        </div>
        <div class="card">
            <h3>Quantum Web</h3>
            <p>Next-gen web applications built with speed in mind.</p>
        </div>
        <div class="card">
            <h3>Cyber Security</h3>
            <p>Robust protection for your digital assets.</p>
        </div>
    </div>
</body>
</html>
