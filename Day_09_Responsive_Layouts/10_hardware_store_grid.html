<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Store Grid | AI Web Portfolio</title>
    <style>
        :root {
            --bg: #050505;
            --primary: #00f2ff;
            --secondary: #7000ff;
            --card-bg: #111;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            padding: 40px;
        }

        .store-header { text-align: center; margin-bottom: 50px; }
        .store-header h1 { font-size: 2.5rem; color: var(--primary); }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid #222;
            border-radius: 4px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .product-card:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            transform: translateY(-5px);
        }

        .spec-label { color: #555; font-size: 0.7rem; text-transform: uppercase; margin-top: 15px; }
        .spec-value { font-size: 1.1rem; color: #ddd; }

        .price {
            margin-top: auto;
            font-size: 1.5rem;
            color: var(--primary);
            padding-top: 20px;
        }

        .buy-btn {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px;
            margin-top: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .buy-btn:hover { background: var(--primary); color: black; }
    </style>
</head>
<body>
    <div class="store-header">
        <h1>RYZEN POWER HUB</h1>
        <p>Premium Components for AI Workstations</p>
    </div>

    <div class="product-grid">
        <div class="product-card">
            <h3>Ryzen 9 7950X</h3>
            <div class="spec-label">Cores / Threads</div>
            <div class="spec-value">16C / 32T</div>
            <div class="price">$549.00</div>
            <button class="buy-btn">ADD TO BUILD</button>
        </div>
        <div class="product-card">
            <h3>RTX 4090 AI Edition</h3>
            <div class="spec-label">VRAM</div>
            <div class="spec-value">24GB GDDR6X</div>
            <div class="price">$1,999.00</div>
            <button class="buy-btn">ADD TO BUILD</button>
        </div>
        <div class="product-card">
            <h3>DDR5 128GB Kit</h3>
            <div class="spec-label">Speed</div>
            <div class="spec-value">6400 MT/s</div>
            <div class="price">$420.00</div>
            <button class="buy-btn">ADD TO BUILD</button>
        </div>
        <div class="product-card">
            <h3>Gen5 NVMe 4TB</h3>
            <div class="spec-label">Read Speed</div>
            <div class="spec-value">12,000 MB/s</div>
            <div class="price">$315.00</div>
            <button class="buy-btn">ADD TO BUILD</button>
        </div>
    </div>
</body>
</html>
