<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar | AI Web Portfolio</title>
    <style>
        :root {
            --nav-bg: #111;
            --accent: #00ff88;
        }

        body { margin: 0; background: #050505; font-family: 'Segoe UI', sans-serif; }

        nav {
            background: var(--nav-bg);
            padding: 0 50px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
        }

        .logo { color: var(--accent); font-weight: 800; font-size: 1.5rem; letter-spacing: 2px; }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover { color: var(--accent); }

        .burger { display: none; cursor: pointer; }
        .burger div { width: 25px; height: 3px; background-color: white; margin: 5px; }

        /* Responsive Mobile Navbar */
        @media screen and (max-width: 768px) {
            nav { padding: 0 20px; }
            .nav-links {
                position: absolute;
                right: 0px;
                height: 92vh;
                top: 70px;
                background-color: var(--nav-bg);
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 50%;
                transform: translateX(100%);
                transition: transform 0.5s ease-in;
                padding-top: 50px;
            }
            .nav-links.active { transform: translateX(0%); }
            .burger { display: block; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">AI.STUDIO</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Team</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div class="burger" onclick="document.querySelector('.nav-links').classList.toggle('active')">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </nav>

    <div style="color: #666; text-align: center; padding: 100px;">
        <h2>Responsive Navigation Concept</h2>
        <p>In mobile view, the horizontal list converts to a sliding side menu.</p>
    </div>
</body>
</html>
