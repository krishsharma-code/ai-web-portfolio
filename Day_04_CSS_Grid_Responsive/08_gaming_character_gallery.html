<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 04 - Gaming Character Gallery</title>
    <style>
        :root {
            --bg: #050505;
            --gaming-red: #ef4444;
        }
        body {
            background: var(--bg);
            color: white;
            padding: 3rem;
            font-family: 'Press Start 2P', system-ui; /* Hypothetical gaming font fallback */
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        .character-card {
            aspect-ratio: 1 / 1;
            background: #111;
            border: 2px solid #222;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .character-card:hover {
            transform: scale(1.05);
            border-color: var(--gaming-red);
            z-index: 10;
        }
        .character-card::before {
            content: "IMG";
            color: #333;
            font-weight: bold;
            font-size: 2rem;
        }
        .name-tag {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: var(--gaming-red);
            color: black;
            text-align: center;
            padding: 5px 0;
            font-weight: bold;
            transform: translateY(100%);
            transition: transform 0.2s ease;
        }
        .character-card:hover .name-tag {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <h1>VS Gaming Studio: Assets</h1>
    <div class="gallery">
        <div class="character-card"><div class="name-tag">HERO_01</div></div>
        <div class="character-card"><div class="name-tag">BOSS_ULTRA</div></div>
        <div class="character-card"><div class="name-tag">NPC_TRADER</div></div>
        <div class="character-card"><div class="name-tag">MOB_GOBLIN</div></div>
        <div class="character-card"><div class="name-tag">LEGEND_MAGE</div></div>
        <div class="character-card"><div class="name-tag">ROGUE_SHADOW</div></div>
    </div>
</body>
</html>
