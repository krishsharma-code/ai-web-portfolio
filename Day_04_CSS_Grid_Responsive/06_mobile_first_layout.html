<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 04 - Mobile First Design</title>
    <style>
        /* BASE STYLES (Mobile First) */
        body {
            background: #111;
            color: white;
            padding: 1rem;
            margin: 0;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr; /* Single column for mobile */
            gap: 1rem;
        }
        .item {
            background: #222;
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
        }

        /* SCALE UP: Tablet (min-width: 768px) */
        @media (min-width: 768px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* SCALE UP: Desktop (min-width: 1200px) */
        @media (min-width: 1200px) {
            .container {
                grid-template-columns: repeat(4, 1fr);
            }
            body { padding: 4rem; }
        }
    </style>
</head>
<body>
    <h1>06 - Mobile First Layout</h1>
    <p>Designing for the smallest screen first ensures a lightweight, robust experience that scales up.</p>
    <div class="container">
        <div class="item">Mobile 1 col -> Desktop 4 col</div>
        <div class="item">Mobile 1 col -> Desktop 4 col</div>
        <div class="item">Mobile 1 col -> Desktop 4 col</div>
        <div class="item">Mobile 1 col -> Desktop 4 col</div>
    </div>
</body>
</html>
