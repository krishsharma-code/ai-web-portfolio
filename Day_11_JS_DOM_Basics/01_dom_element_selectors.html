<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS DOM Selectors | Gamer UI</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --accent: #00ff9d;
            --text: #e0e0e0;
            --card-bg: #16161a;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.1);
            border: 1px solid #333;
            text-align: center;
            max-width: 400px;
        }
        h1 { color: var(--accent); margin-bottom: 1rem; }
        p { margin-bottom: 1.5rem; line-height: 1.6; }
        button {
            background: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        button:hover {
            background: var(--accent);
            color: var(--bg-dark);
            box-shadow: 0 0 15px var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="status-title">System Offline</h1>
        <p class="description">Click the button to initialize the neural link and update the DOM state.</p>
        <button onclick="initializeSystem()">Initialize System</button>
    </div>

    <script>
        function initializeSystem() {
            // Selecting via getElementById
            const title = document.getElementById('status-title');
            
            // Selecting via querySelector
            const description = document.querySelector('.description');

            // Changing text content
            title.textContent = "System Online";
            title.style.color = "#00ff9d";
            
            description.textContent = "Neural link established. DOM manipulation complete. Welcome, Operator.";
            description.style.color = "#888";
        }
    </script>
</body>
</html>
