<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Tracker | VS Gaming</title>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }
        .tracker-ui {
            background: #000;
            padding: 3rem;
            border-radius: 15px;
            border: 2px solid #ff0055;
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.3);
            text-align: center;
            width: 320px;
        }
        .label { font-size: 0.8rem; color: #ff0055; letter-spacing: 4px; margin-bottom: 1rem; }
        
        #score-display {
            font-size: 6rem;
            font-weight: bold;
            margin: 1rem 0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            transition: all 0.2s;
        }

        .controls { display: flex; gap: 1rem; justify-content: center; }
        
        button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: transparent;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover { background: #fff; color: #000; box-shadow: 0 0 15px #fff; }
        .btn-plus:hover { border-color: #00ff9d; background: #00ff9d; box-shadow: 0 0 15px #00ff9d; }
        .btn-minus:hover { border-color: #ff3e3e; background: #ff3e3e; box-shadow: 0 0 15px #ff3e3e; }
        
        .reset-link {
            margin-top: 2rem;
            display: block;
            color: #666;
            text-decoration: none;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .reset-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="tracker-ui">
        <div class="label">PLAYER_01 SCORE</div>
        <div id="score-display">00</div>
        <div class="controls">
            <button class="btn-minus" id="decrease">-</button>
            <button class="btn-plus" id="increase">+</button>
        </div>
        <a class="reset-link" id="reset">RESET COUNTER</a>
    </div>

    <script>
        // Initializing State
        let currentScore = 0;

        const display = document.getElementById('score-display');
        const incBtn = document.getElementById('increase');
        const decBtn = document.getElementById('decrease');
        const resetLink = document.getElementById('reset');

        function updateDisplay() {
            // Padding score with leading zero
            display.textContent = currentScore < 10 && currentScore >= 0 ? `0${currentScore}` : currentScore;
            
            // Adding a little punch effect
            display.style.transform = "scale(1.1)";
            setTimeout(() => {
                display.style.transform = "scale(1)";
            }, 100);
        }

        incBtn.addEventListener('click', () => {
            currentScore++;
            updateDisplay();
        });

        decBtn.addEventListener('click', () => {
            if (currentScore > 0) {
                currentScore--;
                updateDisplay();
            }
        });

        resetLink.addEventListener('click', () => {
            currentScore = 0;
            updateDisplay();
        });
    </script>
</body>
</html>
