<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Quota Dashboard</title>
    <style>
        :root {
            --bg: #050505;
            --accent: #00e5ff;
            --card-bg: #111;
            --text: #eee;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #222;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .card-title {
            font-size: 0.9rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        .gauge-container {
            height: 10px;
            background: #222;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
        }

        .gauge-fill {
            height: 100%;
            background: var(--accent);
            width: 75%;
            transition: width 1s ease-in-out;
        }

        .chart-placeholder {
            height: 100px;
            display: flex;
            align-items: flex-end;
            gap: 5px;
            margin-top: 20px;
        }

        .bar {
            flex: 1;
            background: #333;
            transition: height 0.5s, background 0.5s;
        }

        .bar.active {
            background: var(--accent);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            box-shadow: 0 0 5px #00ff00;
        }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-bottom: 40px; color: var(--accent);">API_RESOURCE_MONITOR_v2</h1>

    <div class="dashboard">
        <!-- Token Usage -->
        <div class="card">
            <div class="card-title">Token Consumption <span>Live</span></div>
            <div class="metric-value" id="token-val">842,109</div>
            <div class="gauge-container">
                <div class="gauge-fill" id="token-gauge" style="width: 84.2%;"></div>
            </div>
            <p style="font-size: 0.8rem; color: #666; margin-top: 10px;">Monthly Limit: 1,000,000</p>
        </div>

        <!-- Latency Gauge -->
        <div class="card">
            <div class="card-title">Avg Execution Delay <span>System</span></div>
            <div class="metric-value" id="delay-val">1.2s</div>
            <div class="gauge-container">
                <div class="gauge-fill" id="delay-gauge" style="width: 40%; background: #ffcc00;"></div>
            </div>
            <p style="font-size: 0.8rem; color: #666; margin-top: 10px;"><span class="status-dot"></span> All nodes operational</p>
        </div>

        <!-- Weekly Activity -->
        <div class="card" style="grid-column: span 1;">
            <div class="card-title">Daily Requests <span>7 Day History</span></div>
            <div class="chart-placeholder" id="chart">
                <!-- Bars generated by JS -->
            </div>
        </div>

        <!-- Model Status -->
        <div class="card">
            <div class="card-title">Active Model Instances</div>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 15px;">
                <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
                    <span>Gemini-2.0-Flash</span>
                    <span style="color: #00ff00;">ONLINE</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
                    <span>Gemini-2.0-Pro</span>
                    <span style="color: #00ff00;">ONLINE</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
                    <span>Custom-Vision-Node</span>
                    <span style="color: #ff3333;">MAINTENANCE</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Simulated Live Updates
        function updateMetrics() {
            const tokenVal = document.getElementById('token-val');
            const tokenGauge = document.getElementById('token-gauge');
            const delayVal = document.getElementById('delay-val');
            const delayGauge = document.getElementById('delay-gauge');

            let tokens = 842109;
            
            setInterval(() => {
                tokens += Math.floor(Math.random() * 50);
                tokenVal.textContent = tokens.toLocaleString();
                tokenGauge.style.width = (tokens / 1000000 * 100) + '%';

                const delay = (Math.random() * 0.5 + 1.0).toFixed(1);
                delayVal.textContent = delay + 's';
                delayGauge.style.width = (delay / 3 * 100) + '%';
                
                if (delay > 2.0) delayGauge.style.background = '#ff3333';
                else if (delay > 1.5) delayGauge.style.background = '#ffcc00';
                else delayGauge.style.background = '#00e5ff';

            }, 2000);
        }

        // Generate Chart Bars
        function generateChart() {
            const chart = document.getElementById('chart');
            const data = [40, 65, 30, 85, 95, 50, 70];
            
            data.forEach((val, i) => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                if (i === data.length - 1) bar.classList.add('active');
                bar.style.height = val + '%';
                chart.appendChild(bar);
            });
        }

        window.onload = () => {
            updateMetrics();
            generateChart();
        };
    </script>
</body>
</html>
