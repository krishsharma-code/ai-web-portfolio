<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Playground</title>
    <style>
        :root {
            --bg: #111;
            --panel: #1a1a1a;
            --accent: #bb86fc;
            --text: #e0e0e0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: var(--panel);
            border-right: 1px solid #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        .editor-container {
            display: flex;
            gap: 20px;
            flex-grow: 1;
        }

        .editor-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            flex-grow: 1;
            background: #000;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 15px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        .btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .log-panel {
            height: 200px;
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .log-entry {
            margin-bottom: 5px;
            border-left: 2px solid var(--accent);
            padding-left: 10px;
        }

        .label {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3 style="color: var(--accent); margin-top: 0;">PROMPT_LAB v1.2</h3>
        
        <div>
            <div class="label">System Instructions</div>
            <select style="width: 100%; background: #222; color: #fff; border: 1px solid #444; padding: 5px; margin-top: 5px;">
                <option>Security Auditor</option>
                <option>Principal Engineer</option>
                <option>Creative Writer</option>
                <option>Python Expert</option>
            </select>
        </div>

        <div>
            <div class="label">Model Selection</div>
            <div style="font-size: 0.9rem; margin-top: 5px;">
                <label><input type="checkbox" checked> Gemini 2.0 Flash</label><br>
                <label><input type="checkbox"> Gemini 2.0 Pro</label>
            </div>
        </div>

        <button class="btn" onclick="runBenchmark()">RUN BENCHMARK</button>
    </div>

    <div class="main-content">
        <div class="editor-container">
            <div class="editor-box">
                <div class="label">System Prompt</div>
                <textarea id="system-prompt">Act as a Staff Security Engineer. Review the provided code for vulnerabilities like SQL injection, XSS, and broken access control. Provide a structured JSON report.</textarea>
            </div>
            <div class="editor-box">
                <div class="label">User Input</div>
                <textarea id="user-input">function login(user, pass) {
    let query = "SELECT * FROM users WHERE username = '" + user + "' AND password = '" + pass + "'";
    return db.execute(query);
}</textarea>
            </div>
        </div>

        <div>
            <div class="label">Execution Logs</div>
            <div class="log-panel" id="logs">
                <div class="log-entry">[SYSTEM] Playground initialized. Awaiting execution...</div>
            </div>
        </div>
    </div>

    <script>
        function runBenchmark() {
            const logs = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            
            const timestamp = new Date().toLocaleTimeString();
            entry.innerHTML = `<span style="color: #888;">[${timestamp}]</span> <span style="color: #00ff00;">[RUNNING]</span> Benchmarking against Gemini 2.0 Flash...`;
            
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;

            setTimeout(() => {
                const response = document.createElement('div');
                response.className = 'log-entry';
                response.innerHTML = `<span style="color: #888;">[${timestamp}]</span> <span style="color: var(--accent);">[RESPONSE]</span> Found 1 High Severity issue: SQL Injection detected in 'login' function.`;
                logs.appendChild(response);
                logs.scrollTop = logs.scrollHeight;
            }, 1500);
        }
    </script>
</body>
</html>
