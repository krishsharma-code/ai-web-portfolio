<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Gamer Profiles | Day 12</title>
    <style>
        :root {
            --neon-green: #39ff14;
            --bg-dark: #080808;
            --card-bg: #151515;
        }
        body {
            background-color: var(--bg-dark);
            color: #eee;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); margin-bottom: 2rem; }
        
        #profile-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .profile-card {
            background: var(--card-bg);
            border: 1px solid rgba(57, 255, 20, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.5s forwards;
        }
        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }
        .avatar {
            width: 60px;
            height: 60px;
            background: var(--neon-green);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: black;
            font-size: 1.5rem;
        }
        .info h3 { margin: 0; color: var(--neon-green); }
        .info p { margin: 0.5rem 0 0; opacity: 0.7; }
        
        .loader {
            margin: 2rem 0;
            color: var(--neon-green);
            font-size: 1.2rem;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Global Player Directory</h1>
    
    <div id="profile-container">
        <!-- Cards will be appended here -->
    </div>
    
    <div class="loader" id="loader">SYNCHRONIZING DATA...</div>

    <script>
        const container = document.getElementById('profile-container');
        const loader = document.getElementById('loader');
        let page = 1;

        const usernames = ["CyberGhost", "VoidWalker", "NeonRebel", "PixelSniper", "DataDaemon", "BitSlayer", "GridRunner", "CodeNova"];
        const ranks = ["Diamond", "Platinum", "Master", "Legend", "Rookie", "Elite"];

        function createProfileCard() {
            const card = document.createElement('div');
            card.className = 'profile-card';
            
            const name = usernames[Math.floor(Math.random() * usernames.length)] + "_" + Math.floor(Math.random() * 9999);
            const rank = ranks[Math.floor(Math.random() * ranks.length)];
            
            card.innerHTML = `
                <div class="avatar">${name[0]}</div>
                <div class="info">
                    <h3>${name}</h3>
                    <p>Rank: ${rank} | Region: Neural-Net-Sector-7</p>
                </div>
            `;
            return card;
        }

        function loadMore() {
            loader.style.display = 'block';
            
            // Mock API delay
            setTimeout(() => {
                for (let i = 0; i < 5; i++) {
                    container.appendChild(createProfileCard());
                }
                loader.style.display = 'none';
                page++;
            }, 1000);
        }

        // Intersection Observer or simple scroll event
        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 100) {
                loadMore();
            }
        });

        // Initial load
        loadMore();
    </script>
</body>
</html>
