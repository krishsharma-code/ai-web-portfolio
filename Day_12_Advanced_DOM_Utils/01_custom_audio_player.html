<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Audio Player | Day 12</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --bg-dark: #0a0a0c;
            --surface: #1a1a20;
            --text: #e0e0e0;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .player-card {
            background: var(--surface);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            width: 350px;
            text-align: center;
            border: 1px solid rgba(0, 243, 255, 0.2);
        }
        .track-info h2 { margin: 0; color: var(--neon-blue); font-size: 1.2rem; }
        .track-info p { margin: 0.5rem 0 1.5rem; opacity: 0.7; font-size: 0.9rem; }
        
        .progress-container {
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 1rem;
            position: relative;
        }
        .progress-bar {
            background: var(--neon-blue);
            height: 100%;
            width: 0%;
            border-radius: 3px;
            box-shadow: 0 0 10px var(--neon-blue);
            transition: width 0.1s linear;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            align-items: center;
        }
        button {
            background: transparent;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-size: 1.5rem;
            transition: transform 0.2s, color 0.2s;
        }
        button:hover { color: var(--neon-blue); transform: scale(1.1); }
        .play-btn {
            background: var(--neon-blue);
            color: var(--bg-dark);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px var(--neon-blue);
        }
        .play-btn:hover { background: #fff; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="track-info">
            <h2>Synthwave Dreams</h2>
            <p>Artist: Gemini AI</p>
        </div>
        
        <audio id="audio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
        
        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div class="time-info">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>
        
        <div class="controls">
            <button id="prev">⏮</button>
            <button class="play-btn" id="play">▶</button>
            <button id="next">⏭</button>
        </div>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play');
        const progress = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const currTime = document.getElementById('current-time');
        const durationTime = document.getElementById('duration');

        let isPlaying = false;

        function togglePlay() {
            if (isPlaying) pauseSong();
            else playSong();
        }

        function playSong() {
            isPlaying = true;
            playBtn.innerText = '⏸';
            audio.play();
        }

        function pauseSong() {
            isPlaying = false;
            playBtn.innerText = '▶';
            audio.pause();
        }

        function updateProgress(e) {
            const { duration, currentTime } = e.srcElement;
            const progressPercent = (currentTime / duration) * 100;
            progress.style.width = `${progressPercent}%`;

            // Time calculation
            let currMins = Math.floor(currentTime / 60);
            let currSecs = Math.floor(currentTime % 60);
            if (currSecs < 10) currSecs = `0${currSecs}`;
            currTime.innerText = `${currMins}:${currSecs}`;
        }

        function setProgress(e) {
            const width = this.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        }

        audio.addEventListener('loadedmetadata', () => {
            let durMins = Math.floor(audio.duration / 60);
            let durSecs = Math.floor(audio.duration % 60);
            if (durSecs < 10) durSecs = `0${durSecs}`;
            durationTime.innerText = `${durMins}:${durSecs}`;
        });

        playBtn.addEventListener('click', togglePlay);
        audio.addEventListener('timeupdate', updateProgress);
        progressContainer.addEventListener('click', setProgress);
        audio.addEventListener('ended', pauseSong);
    </script>
</body>
</html>
