<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Keyframes Basics - Day 10</title>
    <style>
        body {
            background-color: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .loader-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle {
            width: 50px;
            height: 50px;
            background: #ff00ff;
            border-radius: 50%;
            position: absolute;
            animation: bounce 2s infinite ease-in-out, pulse 2s infinite ease-in-out;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }

        .circle:nth-child(2) {
            animation-delay: -0.5s;
            background: #00f3ff;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
        }

        .circle:nth-child(3) {
            animation-delay: -1s;
            background: #9d00ff;
            box-shadow: 0 0 20px rgba(157, 0, 255, 0.5);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-100px) scale(0.8); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; filter: blur(0px); }
            50% { opacity: 0.5; filter: blur(5px); }
        }

        h1 {
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            margin-top: 150px;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: flicker 1.5s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>
    <h1>Processing...</h1>
</body>
</html>
