<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Reveal - Day 10</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            gap: 30px;
            flex-wrap: wrap;
            padding: 20px;
        }

        .team-card {
            position: relative;
            width: 280px;
            height: 380px;
            background: #111;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .image-box {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease;
        }

        .team-card:hover .image-box {
            transform: scale(1.1);
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(transparent, rgba(0, 243, 255, 0.9));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .team-card:hover .overlay {
            transform: translateY(0);
        }

        h3 { margin: 0; font-size: 1.5rem; color: #000; }
        p { margin: 5px 0 0; color: #333; font-weight: bold; }

        .card-1 { background-image: url('https://via.placeholder.com/280x380/1a1a1a/00f3ff?text=Developer+1'); }
        .card-2 { background-image: url('https://via.placeholder.com/280x380/1a1a1a/ff00ff?text=Developer+2'); }
        .card-3 { background-image: url('https://via.placeholder.com/280x380/1a1a1a/00ff00?text=Developer+3'); }
    </style>
</head>
<body>
    <div class="team-card">
        <div class="image-box card-1"></div>
        <div class="overlay">
            <h3>Sarah Chen</h3>
            <p>UI/UX Specialist</p>
        </div>
    </div>

    <div class="team-card">
        <div class="image-box card-2"></div>
        <div class="overlay">
            <h3>Marcus Vane</h3>
            <p>AI Engineer</p>
        </div>
    </div>

    <div class="team-card">
        <div class="image-box card-3"></div>
        <div class="overlay">
            <h3>Elena Ross</h3>
            <p>Project Lead</p>
        </div>
    </div>
</body>
</html>
