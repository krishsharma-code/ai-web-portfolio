<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Flip Card - Day 10</title>
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        .flip-card {
            background-color: transparent;
            width: 300px;
            height: 400px;
            perspective: 1000px; /* Essential for 3D effect */
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flip-card:hover .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; /* Hide the back side */
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid #333;
        }

        .flip-card-front {
            background: #1a1a1a;
            color: #fff;
        }

        .flip-card-back {
            background: #00f3ff;
            color: #000;
            transform: rotateY(180deg);
        }

        .avatar {
            width: 120px;
            height: 120px;
            background: #333;
            border-radius: 50%;
            margin-bottom: 20px;
            background-image: url('https://via.placeholder.com/120');
            background-size: cover;
        }

        h2 { margin: 0; }
        p { color: #888; }
        .back-content p { color: #222; font-weight: bold; }
    </style>
</head>
<body>
    <div class="flip-card">
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <div class="avatar"></div>
                <h2>Alex Rivera</h2>
                <p>Lead AI Architect</p>
            </div>
            <div class="flip-card-back">
                <h2>Contact Info</h2>
                <div class="back-content">
                    <p>📧 alex@ai-studio.io</p>
                    <p>🌐 portfolio.io/alex</p>
                    <p>📍 San Francisco, CA</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
