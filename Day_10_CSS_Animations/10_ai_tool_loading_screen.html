<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Loading Screen - Day 10</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            color: #00f3ff;
        }

        .loader-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-top: 2px solid #00f3ff;
            border-radius: 50%;
            animation: rotate 2s linear infinite;
        }

        .ring:nth-child(2) {
            width: 80%;
            height: 80%;
            border-top: 2px solid #ff00ff;
            animation: rotate-reverse 1.5s linear infinite;
        }

        .ring:nth-child(3) {
            width: 60%;
            height: 60%;
            border-top: 2px solid #00ff00;
            animation: rotate 1s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotate-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        .status {
            position: absolute;
            bottom: -60px;
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulse-text 1.5s infinite alternate;
        }

        @keyframes pulse-text {
            from { opacity: 0.3; }
            to { opacity: 1; text-shadow: 0 0 10px #00f3ff; }
        }

        .scan-line {
            position: absolute;
            width: 100vw;
            height: 2px;
            background: rgba(0, 243, 255, 0.2);
            top: 0;
            box-shadow: 0 0 10px #00f3ff;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100vh; }
        }
    </style>
</head>
<body>
    <div class="scan-line"></div>
    <div class="loader-wrapper">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="status">Syncing Neural Grid...</div>
    </div>
</body>
</html>
