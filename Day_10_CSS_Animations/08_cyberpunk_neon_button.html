<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Neon Button - Day 10</title>
    <style>
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Orbitron', sans-serif;
        }

        .neon-btn {
            background: transparent;
            color: #ff003c;
            font-size: 1.5rem;
            letter-spacing: 5px;
            padding: 20px 40px;
            border: 4px solid #ff003c;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
            overflow: hidden;
            box-shadow: 0 0 10px #ff003c;
        }

        .neon-btn:hover {
            color: #fff;
            background: #ff003c;
            box-shadow: 0 0 50px #ff003c, 0 0 100px #ff003c, 0 0 200px #ff003c;
            text-shadow: 0 0 10px #fff;
        }

        /* Glitch Effect Elements */
        .neon-btn::before {
            content: 'GLITCH';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #00f3ff;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translateX(-100%);
            transition: 0.3s;
            color: #000;
            font-weight: bold;
        }

        .neon-btn:hover::before {
            transform: translateX(0);
            animation: glitch 0.3s infinite;
        }

        @keyframes glitch {
            0% { clip-path: polygon(0 2%, 100% 2%, 100% 5%, 0 5%); transform: translate(0); }
            20% { clip-path: polygon(0 15%, 100% 15%, 100% 15%, 0 15%); transform: translate(-5px); }
            40% { clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%); transform: translate(5px); }
            60% { clip-path: polygon(0 40%, 100% 40%, 100% 40%, 0 40%); transform: translate(-5px); }
            80% { clip-path: polygon(0 50%, 100% 50%, 100% 55%, 0 55%); transform: translate(5px); }
            100% { clip-path: polygon(0 70%, 100% 70%, 100% 80%, 0 80%); transform: translate(0); }
        }
    </style>
</head>
<body>
    <button class="neon-btn">Execute</button>
</body>
</html>
