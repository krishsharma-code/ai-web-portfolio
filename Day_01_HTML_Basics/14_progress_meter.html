<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skill Matrix | Progress & Meters</title>
</head>
<body>
    <h1>My Skill Levels</h1>
    
    <p>Python Proficiency:</p>
    <progress value="85" max="100"></progress> 85%

    <p>C Programming:</p>
    <progress value="60" max="100"></progress> 60%

    <p>HTML Mastery:</p>
    <meter value="0.9" min="0" max="1">90%</meter>

    <p>Daily Energy Level:</p>
    <meter value="7" min="0" max="10" low="3" high="8" optimum="10"></meter>
</body>
</html>
