<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Video Embed - AI Studio</title>
    <style>
        :root {
            --bg: #000;
            --neon-cyan: #00e5ff;
        }
        body {
            background-color: var(--bg);
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .video-container {
            width: 100%;
            max-width: 800px;
            margin-top: 30px;
        }

        /* The Aspect Ratio Trick */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 ratio */
            height: 0;
            overflow: hidden;
            border: 2px solid var(--neon-cyan);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        h2 { color: var(--neon-cyan); text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>
    <h2>Project Showcase</h2>
    <p>Using the padding-bottom hack to maintain a 16:9 aspect ratio on all screens.</p>
    
    <div class="video-container">
        <div class="video-wrapper">
            <!-- Example YouTube Embed -->
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
