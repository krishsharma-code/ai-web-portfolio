<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Images - AI Studio</title>
    <style>
        :root {
            --bg: #050505;
            --neon-gold: #ffcc00;
        }
        body {
            background-color: var(--bg);
            color: #ccc;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Fundamental Responsive Image Rule */
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .image-box {
            margin: 40px 0;
            padding: 20px;
            background: #111;
            border-radius: 12px;
            border-left: 4px solid var(--neon-gold);
        }
        h2 { color: var(--neon-gold); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Adaptive Visuals</h1>
        
        <div class="image-box">
            <h2>The Basic Rule</h2>
            <p><code>max-width: 100%; height: auto;</code> keeps images within their containers.</p>
            <!-- Using a high-quality placeholder -->
            <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&q=80&w=1000" alt="AI Concept">
        </div>

        <div class="image-box">
            <h2>The Picture Element</h2>
            <p>Swapping images based on screen size (Art Direction).</p>
            <picture>
                <source media="(min-width: 800px)" srcset="https://images.unsplash.com/photo-1620712943543-bcc4628c9757?auto=format&fit=crop&q=80&w=1000">
                <source media="(min-width: 400px)" srcset="https://images.unsplash.com/photo-1614741118887-7a4ee193a5fa?auto=format&fit=crop&q=80&w=600">
                <img src="https://images.unsplash.com/photo-1614741118887-7a4ee193a5fa?auto=format&fit=crop&q=80&w=400" alt="Adaptive AI">
            </picture>
        </div>
    </div>
</body>
</html>
