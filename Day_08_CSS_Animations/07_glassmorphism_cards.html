<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 8: Glassmorphism Cards</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #334155, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .card {
            width: 300px;
            height: 400px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            color: white;
            text-align: center;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(45deg, #00f2ff, #0061ff);
            z-index: -1;
            filter: blur(5px);
        }

        .c1 { width: 150px; height: 150px; top: -50px; left: -50px; animation: orbit1 10s infinite linear; }
        .c2 { width: 100px; height: 100px; bottom: -30px; right: -30px; background: #ff00cc; animation: orbit2 8s infinite linear; }

        @keyframes orbit1 {
            from { transform: rotate(0deg) translateX(50px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(50px) rotate(-360deg); }
        }
        @keyframes orbit2 {
            from { transform: rotate(0deg) translateX(30px) rotate(0deg); }
            to { transform: rotate(-360deg) translateX(30px) rotate(360deg); }
        }

        h2 { margin-bottom: 10px; font-weight: 600; }
        p { font-size: 0.9rem; opacity: 0.8; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <div class="card">
            <h2>Glass UI</h2>
            <p>Modern frosted glass effect using backdrop-filter and subtle CSS floating animations.</p>
        </div>
    </div>
</body>
</html>
