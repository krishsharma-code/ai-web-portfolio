<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 8: Loading Spinners</title>
    <style>
        :root {
            --bg: #000;
            --accent: #00ff88;
        }

        body {
            background-color: var(--bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Spinner 1: Double Ring */
        .spinner-1 {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 255, 136, 0.1);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: relative;
        }

        .spinner-1::after {
            content: '';
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 4px solid rgba(0, 255, 136, 0.1);
            border-bottom: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1.5s linear infinite reverse;
        }

        /* Spinner 2: Pulse Dots */
        .spinner-2 {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 15px;
            height: 15px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 1.2s infinite ease-in-out;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        /* Spinner 3: Glitch Block */
        .spinner-3 {
            width: 50px;
            height: 50px;
            background: var(--accent);
            animation: glitchBlock 2s infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }

        @keyframes glitchBlock {
            0% { transform: perspective(120px) rotateX(0deg) rotateY(0deg); }
            50% { transform: perspective(120px) rotateX(-180deg) rotateY(0deg); background: #00d4ff; }
            100% { transform: perspective(120px) rotateX(-180deg) rotateY(-180deg); }
        }
    </style>
</head>
<body>
    <div class="spinner-1"></div>
    <div class="spinner-2">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
    <div class="spinner-3"></div>
</body>
</html>
