<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 8: Bouncing Elements</title>
    <style>
        :root {
            --bg: #0f172a;
            --neon-blue: #38bdf8;
            --neon-pink: #f472b6;
        }

        body {
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            margin: 0;
            padding-bottom: 50px;
            gap: 100px;
            overflow: hidden;
        }

        .ball {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            position: relative;
        }

        .ball-1 {
            background: var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue);
            animation: bounce 2s infinite ease-in-out;
        }

        .ball-2 {
            background: var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink);
            animation: bounce 2s infinite cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1.1, 0.9); }
            50% { transform: translateY(-400px) scale(0.9, 1.1); }
        }

        .label {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: sans-serif;
            white-space: nowrap;
            font-size: 0.8rem;
        }

        .floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50px;
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="floor"></div>
    
    <div class="ball ball-1">
        <span class="label">ease-in-out</span>
    </div>

    <div class="ball ball-2">
        <span class="label">cubic-bezier (Bouncy)</span>
    </div>
</body>
</html>
