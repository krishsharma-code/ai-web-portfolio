<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Studio Splash Screen</title>
    <style>
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
        }

        .logo-container {
            text-align: center;
            position: relative;
        }

        .vs-logo {
            font-size: 8rem;
            color: #fff;
            font-weight: 900;
            letter-spacing: -10px;
            opacity: 0;
            transform: scale(0.5);
            animation: logoIn 1.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        @keyframes logoIn {
            0% { opacity: 0; transform: scale(0.5) translateY(50px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        .studio-text {
            color: #ff0055;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 10px;
            margin-top: -20px;
            opacity: 0;
            animation: textReveal 1s ease-out 1.2s forwards;
        }

        @keyframes textReveal {
            from { opacity: 0; transform: translateY(20px); letter-spacing: 20px; }
            to { opacity: 1; transform: translateY(0); letter-spacing: 10px; }
        }

        .glitch-line {
            position: absolute;
            height: 2px;
            width: 0;
            background: #ff0055;
            left: 50%;
            transform: translateX(-50%);
            bottom: -10px;
            animation: lineExtend 0.8s ease-out 2s forwards;
        }

        @keyframes lineExtend {
            from { width: 0; }
            to { width: 200px; }
        }

        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 2px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 10;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            from { top: -2%; }
            to { top: 102%; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scanline"></div>
    <div class="logo-container">
        <div class="vs-logo">VS</div>
        <div class="studio-text">Gaming Studio</div>
        <div class="glitch-line"></div>
    </div>
</body>
</html>
