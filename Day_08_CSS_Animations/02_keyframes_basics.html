<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 8: Keyframes Basics</title>
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #00ffcc;
            --secondary-color: #0099ff;
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent-color);
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px var(--accent-color); }
            to { text-shadow: 0 0 25px var(--accent-color), 0 0 40px var(--secondary-color); }
        }

        .container {
            position: relative;
            width: 400px;
            height: 400px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, var(--accent-color), var(--secondary-color));
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            animation: complexMove 6s infinite ease-in-out;
        }

        @keyframes complexMove {
            0% {
                transform: translate(-100px, -100px) rotate(0deg) scale(1);
                filter: hue-rotate(0deg);
            }
            25% {
                transform: translate(100px, -100px) rotate(90deg) scale(1.2);
                border-radius: 50%;
            }
            50% {
                transform: translate(100px, 100px) rotate(180deg) scale(0.8);
                border-radius: 20%;
            }
            75% {
                transform: translate(-100px, 100px) rotate(270deg) scale(1.2);
                border-radius: 50%;
            }
            100% {
                transform: translate(-100px, -100px) rotate(360deg) scale(1);
                filter: hue-rotate(360deg);
            }
        }

        .orbit {
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px white;
            animation: orbital 4s infinite linear;
        }

        @keyframes orbital {
            from { transform: rotate(0deg) translateX(150px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(150px) rotate(-360deg); }
        }
    </style>
</head>
<body>
    <h1>Infinite Flow</h1>
    <div class="container">
        <div class="box"></div>
        <div class="orbit"></div>
    </div>
</body>
</html>
