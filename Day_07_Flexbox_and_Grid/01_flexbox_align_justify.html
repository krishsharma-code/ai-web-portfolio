<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox: Align & Justify | Cyber-Portfolio</title>
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #00f3ff;
            --card-bg: #111;
            --text-color: #e0e0e0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid var(--accent-color);
            width: 100%;
            box-shadow: 0 0 15px var(--accent-color);
        }

        h1 {
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent-color);
        }

        .container {
            width: 80%;
            max-width: 1000px;
            margin-top: 3rem;
            padding: 2rem;
            border: 1px solid #333;
            background: var(--card-bg);
            border-radius: 10px;
        }

        .flex-demo {
            display: flex;
            height: 300px;
            background-color: #1a1a1a;
            border: 2px dashed var(--accent-color);
            margin-bottom: 2rem;
            /* Core Concepts */
            justify-content: space-around; /* Horizontal Alignment */
            align-items: center;          /* Vertical Alignment */
        }

        .box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-color), #bc13fe);
            color: black;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            box-shadow: 0 0 10px var(--accent-color);
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        code {
            color: var(--accent-color);
            background: #222;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Flexbox: Align & Justify</h1>
    </header>

    <div class="container">
        <p>This demo showcases how <code>justify-content</code> and <code>align-items</code> work together to position items within a flex container.</p>
        
        <div class="flex-demo">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
        </div>

        <div class="controls">
            <p>Applied properties: <code>justify-content: space-around;</code> and <code>align-items: center;</code></p>
        </div>
    </div>
</body>
</html>
