<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox: Grow & Shrink | Cyber-Portfolio</title>
    <style>
        :root {
            --bg-color: #050505;
            --neon-green: #39ff14;
            --card-bg: #111;
            --text-color: #e0e0e0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 2rem;
        }

        header {
            border-left: 5px solid var(--neon-green);
            padding-left: 1rem;
            margin-bottom: 3rem;
        }

        h1 {
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            display: flex;
            gap: 1rem;
            background: #1a1a1a;
            padding: 1rem;
            border: 1px solid #333;
            height: 200px;
        }

        .item {
            background: #222;
            border: 1px solid var(--neon-green);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            box-shadow: inset 0 0 10px rgba(57, 255, 20, 0.2);
        }

        /* Flex Growth Dynamics */
        .grow-1 { flex-grow: 1; }
        .grow-2 { flex-grow: 2; }
        .grow-3 { flex-grow: 3; }

        .item code {
            display: block;
            margin-top: 10px;
            color: var(--neon-green);
        }

        .description {
            margin-top: 2rem;
            line-height: 1.6;
            color: #aaa;
        }
    </style>
</head>
<body>
    <header>
        <h1>Flex-Grow Dynamics</h1>
    </header>

    <div class="container">
        <div class="item grow-1">
            <span>Item A</span>
            <code>flex-grow: 1</code>
        </div>
        <div class="item grow-2">
            <span>Item B</span>
            <code>flex-grow: 2</code>
        </div>
        <div class="item grow-1">
            <span>Item C</span>
            <code>flex-grow: 1</code>
        </div>
    </div>

    <div class="description">
        <p>In this example, Item B takes up twice as much available space as Item A or Item C. The <code>flex-grow</code> property defines the ability for a flex item to grow if necessary.</p>
    </div>
</body>
</html>
