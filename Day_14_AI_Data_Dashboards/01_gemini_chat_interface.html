<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chat Interface</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --user-msg: #3b82f6;
            --ai-msg: #334155;
            --text-color: #f1f5f9;
            --input-bg: #0f172a;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 400px;
            height: 600px;
            background-color: var(--chat-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .chat-header {
            padding: 16px;
            background-color: #111827;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #334155;
        }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }
        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .ai-message {
            align-self: flex-start;
            background-color: var(--ai-msg);
            color: var(--text-color);
            border-bottom-left-radius: 4px;
        }
        .chat-input-area {
            padding: 16px;
            background-color: #111827;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input {
            flex: 1;
            background-color: var(--input-bg);
            border: 1px solid #334155;
            color: white;
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }
        button {
            background-color: var(--user-msg);
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .typing-indicator {
            font-size: 12px;
            color: #94a3b8;
            margin-top: -8px;
            padding-left: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Gemini AI Assistant</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">Hello! How can I help you today?</div>
        </div>
        <div class="typing-indicator" id="typingIndicator">Gemini is typing...</div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask anything...">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');

        function addMessage(text, isUser) {
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            msg.textContent = text;
            chatMessages.appendChild(msg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.addEventListener('click', () => {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, true);
            userInput.value = '';

            // Simulate AI response
            typingIndicator.style.display = 'block';
            setTimeout(() => {
                typingIndicator.style.display = 'none';
                addMessage("I am a simulation of Gemini AI. This is a UI demo.", false);
            }, 2000);
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });
    </script>
</body>
</html>
