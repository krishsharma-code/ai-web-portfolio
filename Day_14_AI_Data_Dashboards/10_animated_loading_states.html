<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Loading States</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 60px;
        }
        .loader-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        /* 1. Pulse Rings */
        .pulse-loader {
            width: 50px;
            height: 50px;
            background-color: #3b82f6;
            border-radius: 50%;
            position: relative;
        }
        .pulse-loader::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid #3b82f6;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* 2. Wave Dots */
        .wave-loader {
            display: flex;
            gap: 8px;
        }
        .dot {
            width: 12px;
            height: 12px;
            background-color: #8b5cf6;
            border-radius: 50%;
            animation: wave 1.2s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes wave {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 3. Skeleton Shimmer */
        .skeleton {
            width: 250px;
            height: 100px;
            background: #1e293b;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 10px;
        }
        .line {
            height: 12px;
            background: #334155;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        .line::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <div class="loader-card">
        <div class="pulse-loader"></div>
        <span>Thinking...</span>
    </div>

    <div class="loader-card">
        <div class="wave-loader">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <span>Generating Tokens...</span>
    </div>

    <div class="loader-card">
        <div class="skeleton">
            <div class="line" style="width: 80%;"></div>
            <div class="line" style="width: 100%;"></div>
            <div class="line" style="width: 60%;"></div>
        </div>
        <span>Rendering UI...</span>
    </div>
</body>
</html>
