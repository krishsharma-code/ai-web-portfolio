<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 - Colors & Backgrounds</title>
    <style>
        body {
            background-color: #121212; /* Hex Color */
            color: #e0e0e0;
            padding: 50px;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 100%;
            height: 200px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 12px;
            text-align: center;
        }

        /* Linear Gradient Background */
        .gradient-bg {
            background: linear-gradient(135deg, #6200ee, #03dac6);
            color: white;
        }

        /* RGB and RGBA (Alpha for transparency) */
        .rgba-bg {
            background-color: rgba(0, 255, 204, 0.2); /* 20% opacity neon teal */
            border: 2px solid #00ffcc;
            color: #00ffcc;
        }

        /* Placeholder for Background Image concept */
        .image-bg {
            background-color: #333;
            background-image: radial-gradient(circle, #444 10%, transparent 11%);
            background-size: 20px 20px;
            border: 1px dashed #666;
        }
    </style>
</head>
<body>

    <h1>Colors & Backgrounds</h1>

    <div class="box gradient-bg">
        Linear Gradient <br> (Hex: #6200ee to #03dac6)
    </div>

    <div class="box rgba-bg">
        RGBA Color <br> rgba(0, 255, 204, 0.2)
    </div>

    <div class="box image-bg">
        Patterned Background <br> (Using radial-gradient as a pattern)
    </div>

</body>
</html>
